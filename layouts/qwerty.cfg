(defcfg
  process-unmapped-keys yes
)

;; QWERTY base with home-row mods, caps→esc/ctrl, and space-held navigation.
;; Navigation uses the same physical key positions as colemak-dh.cfg.

(defsrc
  f1   f2   f7   f8   f9   f10  f11  f12
  caps
  u    i
  a    s    d    f    h    j    k    l    ;
  lsft rsft
  spc
)

(deflayer qwerty
  brdn brup prev pp   next mute vold volu
  @cap
  _    _
  @a   @s   @d   @f   _    @j   @k   @l   @scln
  @lsft @rsft
  @spc
)

(deflayer nav
  XX   XX   XX   XX   XX   XX   XX   XX
  XX
  C-S-tab  C-tab
  XX   XX   XX   f13  left  down  up    rght  ret
  XX   XX
  XX
)

(defalias
  cap  (tap-hold 200 200 esc lctl)
  a    (tap-hold 200 300 a lctl)
  s    (tap-hold 200 300 s lalt)
  d    (tap-hold 200 200 d lsft)
  f    (tap-hold 200 200 f lmet)
  j    (tap-hold 200 200 j lmet)
  k    (tap-hold 200 200 k lsft)
  l    (tap-hold 200 300 l lalt)
  scln (tap-hold 200 300 ; lctl)
  lsft (tap-hold 200 200 (one-shot 1000 lsft) lsft)
  rsft (tap-hold 200 200 (one-shot 1000 rsft) rsft)
  spc  (tap-hold 200 200 spc (layer-while-held nav))
)
